name: Sync upstream Astro Cactus template
on:
  push:
    branches: [astro-cactus-migration]
permissions:
  contents: write
concurrency:
  group: cactus-template-sync
  cancel-in-progress: false
jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[hydrate-cactus]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: astro-cactus-migration
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout official Astro Cactus template
        uses: actions/checkout@v4
        with:
          repository: chrismwilliams/astro-theme-cactus
          ref: main
          path: .cactus-template
      - name: Copy theme and retain migrated content
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p content/posts public
          cp -f src/content/posts/*.md content/posts/
          cp -a .cactus-template/src/. src/
          cp -a .cactus-template/public/. public/
          for f in astro.config.ts package.json pnpm-lock.yaml pnpm-workspace.yaml tailwind.config.ts tsconfig.json .nvmrc .prettierrc.js .prettierignore biome.json; do
            if [ -f ".cactus-template/$f" ]; then cp ".cactus-template/$f" "$f"; fi
          done
          rm -rf src/content
          mkdir -p content/tags
          cat > content/tags/malware-analysis.md <<'EOF'
          ---
          title: Malware Analysis
          description: Malware analysis and reverse engineering research.
          ---

          Technical write-ups covering malware behavior, unpacking, configuration extraction, and reverse engineering.
          EOF
          cat > src/site.config.ts <<'EOF'
          import type { AstroExpressiveCodeOptions } from "astro-expressive-code";
          import type { SiteConfig } from "@/types";
          export const siteConfig: SiteConfig = {
            url: "https://hamthegh0st.github.io",
            title: "hamthegh0st",
            author: "Mohamed El-shahat Ramadan",
            description: "Malware analysis, reverse engineering, and low-level security research.",
            lang: "en-GB",
            ogLocale: "en_GB",
            showLogo: true,
            date: { options: { day: "numeric", month: "short", year: "numeric" } },
          };
          export const menuLinks = [
            { path: "/", title: "Home" },
            { path: "/about/", title: "About" },
            { path: "/posts/", title: "Posts" },
            { path: "/tags/", title: "Tags" },
          ];
          export const expressiveCodeOptions: AstroExpressiveCodeOptions = {
            styleOverrides: { borderRadius: "4px", codeFontFamily: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace', codeFontSize: "0.875rem", codeLineHeight: "1.7142857rem", codePaddingInline: "1rem", frames: { frameBoxShadowCssValue: "none" }, uiLineHeight: "inherit" },
            themeCssSelector(theme, { styleVariants }) {
              if (styleVariants.length >= 2) {
                const baseTheme = styleVariants[0]?.theme;
                const altTheme = styleVariants.find((v) => v.theme.type !== baseTheme?.type)?.theme;
                if (theme === baseTheme || theme === altTheme) return `[data-theme='${theme.type}']`;
              }
              return `[data-theme="${theme.name}"]`;
            },
            themes: ["dracula", "github-light"],
            useThemedScrollbars: false,
          };
          EOF
          cat > src/pages/index.astro <<'EOF'
          ---
          import { type CollectionEntry } from "astro:content";
          import PostPreview from "@/components/blog/PostPreview.astro";
          import SocialList from "@/components/SocialList.astro";
          import { getAllPosts } from "@/data/post";
          import PageLayout from "@/layouts/Base.astro";
          import { collectionDateSort } from "@/utils/date";
          const posts = (await getAllPosts()).sort(collectionDateSort) as CollectionEntry<"post">[];
          ---
          <PageLayout meta={{ title: "Malware Analysis & Reverse Engineering" }}>
            <section>
              <h1 class="title mb-8">Malware Analysis &amp; Reverse Engineering</h1>
              <p class="mb-4">Technical write-ups, lab notes, and research on malware behavior, reverse engineering, Windows internals, unpacking, and low-level security.</p>
              <SocialList />
            </section>
            <section class="mt-16">
              <h2 class="title mb-6 text-xl">Latest posts</h2>
              <ul class="space-y-4" role="list">{posts.slice(0, 10).map((post) => <li class="grid gap-1 sm:grid-cols-[auto_1fr]"><PostPreview post={post} withDesc /></li>)}</ul>
            </section>
          </PageLayout>
          EOF
          cat > src/pages/about.astro <<'EOF'
          ---
          import PageLayout from "@/layouts/Base.astro";
          ---
          <PageLayout meta={{ title: "About", description: "About Mohamed El-shahat Ramadan and his security research." }}>
            <h1 class="title mb-8">About</h1>
            <div class="prose prose-sm prose-cactus max-w-none">
              <p>I'm Mohamed, a cybersecurity student focused on malware analysis, reverse engineering, and low-level systems programming.</p>
              <p>This blog documents hands-on research, malware behavior analysis, unpacking, debugging, Windows internals, and reverse engineering workflows.</p>
              <p>Most posts are based on isolated lab environments and focus on understanding how malicious software works under the hood.</p>
            </div>
          </PageLayout>
          EOF
          cat > src/pages/categories/malware-analysis/index.astro <<'EOF'
          ---
          import PageLayout from "@/layouts/Base.astro";
          ---
          <PageLayout meta={{ title: "Malware Analysis" }}>
            <meta http-equiv="refresh" content="0;url=/tags/malware-analysis/" />
            <h1 class="title">Malware Analysis</h1>
            <p>This category has moved to <a class="cactus-link" href="/tags/malware-analysis/">Malware Analysis</a>.</p>
          </PageLayout>
          EOF
          cat > src/components/SocialList.astro <<'EOF'
          ---
          import { Icon } from "astro-icon/components";
          const socialLinks = [
            { friendlyName: "GitHub", link: "https://github.com/hamthegh0st", name: "mdi:github" },
            { friendlyName: "LinkedIn", link: "https://www.linkedin.com/in/mhmdelshahhat", name: "mdi:linkedin" },
          ];
          ---
          <div class="flex flex-wrap items-end gap-x-2"><p>Find me on</p><ul class="flex flex-1 items-center gap-x-2 sm:flex-initial">{socialLinks.map(({ friendlyName, link, name }) => <li class="flex"><a class="hover:text-link inline-block" href={link} rel="noreferrer" target="_blank"><Icon aria-hidden="true" class="h-8 w-8" focusable="false" name={name}/><span class="sr-only">{friendlyName}</span></a></li>)}</ul></div>
          EOF
          cat > .github/workflows/pages-deploy.yml <<'EOF'
          name: Build and Deploy Astro
          on:
            push:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: read
            pages: write
            id-token: write
          concurrency:
            group: pages
            cancel-in-progress: true
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: pnpm/action-setup@v4
                  with:
                    version: 10
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24
                    cache: pnpm
                - run: pnpm install --frozen-lockfile
                - run: pnpm build
                - uses: actions/upload-pages-artifact@v4
                  with:
                    path: ./dist
            deploy:
              needs: build
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              runs-on: ubuntu-latest
              steps:
                - id: deployment
                  uses: actions/deploy-pages@v4
          EOF
          cat > .github/workflows/astro-validation.yml <<'EOF'
          name: Validate Astro migration
          on:
            pull_request:
            push:
              branches: [astro-cactus-migration]
          permissions:
            contents: read
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: pnpm/action-setup@v4
                  with:
                    version: 10
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24
                    cache: pnpm
                - run: pnpm install --frozen-lockfile
                - run: pnpm build
          EOF
          rm -rf .cactus-template
      - name: Commit synchronized theme
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "[hydrate-cactus] sync upstream Astro Cactus and migrate blog content" || exit 0
          git push origin HEAD:astro-cactus-migration
