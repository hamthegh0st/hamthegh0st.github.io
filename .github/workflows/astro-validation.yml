name: Validate Astro site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify post routes, hidden-post behavior, and static assets
        run: |
          test -f dist/posts/xworm-full-analysis/index.html
          test -f dist/posts/brbbot-full-analysis/index.html
          test -f dist/posts/hancitor-full-analysis/index.html
          test -f dist/assets/images/brbbot/s1.PNG
          grep -q 'name="robots" content="noindex,follow"' dist/posts/brbbot-full-analysis/index.html
          for page in dist/index.html dist/posts/index.html dist/tags/malware-analysis/index.html dist/rss.xml; do
            if grep -qF '[lab] Brbbot: Full Malware Analysis &amp; Reverse Engineering' "$page"; then
              echo "Hidden Brbbot post leaked into $page"
              exit 1
            fi
          done
