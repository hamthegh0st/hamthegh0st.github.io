name: Validate Astro Cactus migration
on:
  pull_request:
  push:
    branches: [astro-cactus-migration]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify migrated post routes and legacy images
        run: |
          test -f dist/posts/xworm-full-analysis/index.html
          test -f dist/posts/brbbot-full-analysis/index.html
          test -f dist/posts/hancitor-full-analysis/index.html
          test -d dist/assets
          test -d dist/assets/images
